{% extends "filter/index.html" %}

{% load crispy_forms_tags %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form action="" method="post" enctype="multipart/form-data" onkeypress="return event.keyCode != 13;">
            {% csrf_token %}
            <div class="container text-center mb-3 ">
                <textarea class="form-control sz-text" placeholder="Insert your text" ></textarea>
            </div>

            <div class="">
                <button type="button" class="btn btn-secondary" > Autofill </button>
            </div>
            

            <hr style="border: 1px solid black;">

            <div class="form-actions add-stl">
                <p><input type="submit" class="btn btn-success" value="Submit"></p>
            </div>
        </form>
    </div>
</div>

{% endblock %}
